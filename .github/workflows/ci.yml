# Format, lint and test on every push and pull request.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The D-Bus tests start their own dbus-daemon (spec implementation §4).
      - run: command -v dbus-daemon || (sudo apt-get update && sudo apt-get install -y dbus-daemon)
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p xtask -- dist
