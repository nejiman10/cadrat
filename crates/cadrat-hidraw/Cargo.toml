[package]
name = "cadrat-hidraw"
description = "Linux hidraw discovery, selection, sending and Receiver management for cadrat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# In-memory System and Device for tests of this crate and of cadrat-tool.
fake = []

[lints]
workspace = true

[dependencies]
cadrat-proto = { path = "../cadrat-proto" }
rustix = { version = "1.1.5", features = ["event", "fs"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1"
cadrat-hidraw = { path = ".", features = ["fake"] }
