[package]
name = "cadrat-dbus"
description = "The D-Bus names, arguments and errors shared by cadratd and cadratctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cadrat-cli = { path = "../cadrat-cli" }
cadrat-config = { path = "../cadrat-config" }
cadrat-proto = { path = "../cadrat-proto" }
serde_json = "1.0.151"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
