[workspace]
resolver = "3"
members = ["crates/cadrat-proto", "crates/cadrat-config", "crates/cadrat-hidraw", "crates/cadrat-cli", "crates/cadrat-command", "crates/cadrat-tool", "crates/cadrat-hold-open", "crates/cadrat-dbus", "crates/cadratd", "crates/cadratctl", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nejiman10/cadrat"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
